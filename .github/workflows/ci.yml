name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: nynz_concurrency
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Real multi-connection concurrency tests (tests/concurrency) run against this service.
      NYNZ_PG_URL: postgres://postgres:ci-only@localhost:5432/nynz_concurrency
      NYNZ_EMAIL_DELIVERY: disabled
      # Placeholder values so the production build can compile; no real services are contacted.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
      PREVIEW_SIGNING_SECRET: ci-only-preview-signing-secret-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir preview-host install --frozen-lockfile
      - name: Secret scan (tracked files)
        run: pnpm exec tsx scripts/check-secrets.ts
      - name: Dependency audit (fails on critical advisories in production dependencies)
        run: |
          pnpm audit --prod --audit-level critical
          pnpm --dir preview-host audit --prod --audit-level critical
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit, database and multi-connection concurrency tests
        run: pnpm test
      - run: pnpm check:brand
      - run: pnpm build
      - name: Public customer browser journey
        run: |
          pnpm exec playwright-core install --with-deps chromium
          pnpm start --port 3100 > /tmp/nynz-ci-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://localhost:3100/")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,500))}process.exit(1)'
          export CHROME_PATH="$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')"
          NYNZ_VERIFY_BASE_URL=http://localhost:3100 pnpm exec tsx scripts/verify-public-pages.ts
