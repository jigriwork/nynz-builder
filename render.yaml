services:
  - type: worker
    name: nynz-build-worker
    runtime: node
    region: singapore
    plan: starter
    branch: feat/nynz-platform
    autoDeploy: true
    # Give an active build up to five minutes to finish on deploy or restart.
    # Anything longer is requeued by recover_stale_build_jobs.
    maxShutdownDelaySeconds: 300
    buildCommand: pnpm install --frozen-lockfile
    # Run node directly so Render's SIGTERM reaches the worker without a
    # package-manager wrapper in between.
    startCommand: node --import tsx scripts/worker.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_ID
        value: render-worker-1
      - key: PREVIEW_ORIGIN
        value: https://preview.nynz.in
      - key: SARVAM_MODEL
        value: sarvam-105b
      - key: SARVAM_BASE_URL
        value: https://api.sarvam.ai/v2
      - key: E2B_TEMPLATE
        value: code-interpreter-v1
      - key: E2B_SANDBOX_TIMEOUT_MS
        value: "600000"
      - key: GENERATION_MAX_OUTPUT_TOKENS
        value: "20000"
      - key: GENERATION_MAX_REPAIRS
        value: "2"
      - key: OPENROUTER_PLANNER_MODEL
        value: google/gemini-3.8-flash
      - key: OPENROUTER_CREATE_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: OPENROUTER_EDIT_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: OPENROUTER_FALLBACK_MODELS
        value: google/gemini-3.8-flash,anthropic/claude-sonnet-5.5
      - key: OPENROUTER_BATCH_OUTPUT_TOKENS
        value: "12000"
      - key: OPENROUTER_REQUEST_TIMEOUT_MS
        value: "240000"
      - key: OPENROUTER_MAX_COST_INR_PER_BUILD
        value: "75"
      - key: USD_TO_INR_RATE
        value: "95"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      # Required since release 0.3 (the worker checks preview signing at start-up).
      # Use the same value as the web app and preview host; never the service key.
      - key: PREVIEW_SIGNING_SECRET
        sync: false
      - key: PREVIEW_IDLE_DAYS
        value: "7"
      - key: PAISE_PER_CREDIT
        value: "100"
